---
  server:
    address:
    port: 8080
  spring:
    application:
      name: sights-on-map-api
    datasource:
      url: jdbc:postgresql://localhost:5432/sights-on-map-api
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        open-in-view: false
        show_sql: true
        hibernate:
          dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration
      url: jdbc:postgresql://localhost:5432/sights-on-map-api
      user: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver